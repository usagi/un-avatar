recommendations_label = "Look recommendations"
natural = "Respect model-authored materials, keep color correction neutral, and leave bloom off."
clear = "Use a light silhouette outline, subtle contact shadow, and slight contrast for clearer stream visibility."
pop = "Add silhouette outline, Pop color look, and compact bloom for a stronger impression."
soft = "Use Soft look, subtle shadow, and low SSAO/bloom for a gentler presentation."
