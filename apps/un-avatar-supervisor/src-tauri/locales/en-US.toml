natural = "Respect model-authored outline/rim, keep color correction neutral, and leave bloom off."
clear = "Use light outline override, subtle contact shadow, and slight contrast for clearer stream visibility."
pop = "Add outline/rim accent, Pop color look, and compact bloom for a stronger impression."
soft = "Use Soft look, subtle shadow, and low SSAO/bloom for a gentler presentation."
