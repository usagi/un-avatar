outline_width = "Avatar-space width in millimeters. It is approximated on screen using camera distance."
outline_lighting = "0 uses a flat color; 1 mixes in light-direction shading."
outline_roundness = "Rounds jagged outline corners. Adjust from 0 to 1."
contact_shadow = "Draw a soft shadow under the avatar origin."
shadow_strength = "Contact shadow opacity."
shadow_radius = "Contact shadow radius in model units."
shadow_softness = "Contact shadow edge softness."
shadow_height = "Contact shadow plane height in model units."
ssao = "Depth-based screen-space ambient occlusion. Keep subtle for anime-style faces."
ssao_strength = "SSAO darkness. Lower values are safer for avatar faces."
ssao_radius = "SSAO sample radius in screen pixels."
ssao_bias = "SSAO depth bias. Raise it to suppress dirty flat areas."
ssao_range = "SSAO depth range. Lower values keep the effect local."
exposure = "Final exposure adjustment in stops. 0 keeps authored brightness."
contrast = "Final contrast multiplier. 1 keeps authored contrast."
saturation = "Final saturation multiplier. 1 keeps authored saturation."
color_look = "Final color grading look. Neutral keeps the authored color balance."
look_strength = "Color look blend strength. 0 disables the selected look."
temperature = "White balance temperature. Negative is cooler, positive is warmer."
tint = "White balance tint. Negative leans green, positive leans magenta."
bloom = "Lightweight final-pass bloom. Disabled by default."
