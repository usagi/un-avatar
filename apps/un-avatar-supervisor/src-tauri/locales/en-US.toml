texture_role_normal = "Normal maps default to GPU Native compression when supported."
texture_role_occlusion = "Occlusion maps default to GPU Native compression when supported."
texture_role_emissive = "Emissive maps default to High Quality compression."
texture_role_generic_color = "Other color textures default to Auto. Benchmark before forcing high-quality compression."
