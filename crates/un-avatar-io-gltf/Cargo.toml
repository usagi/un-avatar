[package]
name = "un-avatar-io-gltf"
description = "UN Avatar — glTF 2.0 import with static mesh + skinning (Phase 1.3–1.4 bootstrap)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { version = "0.32", features = ["bytemuck"] }
gltf = { version = "1.4", features = [
 "import",
 "KHR_materials_unlit",
 "names",
] }
image = { version = "0.25", default-features = false, features = [
 "png",
 "jpeg",
] }
serde = { workspace = true }
un-avatar-core = { path = "../un-avatar-core" }
un-avatar-io = { path = "../un-avatar-io" }

[lints]
workspace = true
