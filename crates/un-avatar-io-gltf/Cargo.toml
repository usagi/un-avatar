[package]
name = "un-avatar-io-gltf"
description = "UN Avatar — glTF 2.0 import with static mesh + skinning (Phase 1.3–1.4 bootstrap)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { version = "0.32", features = ["bytemuck"] }
gltf = { version = "1.4", features = [
 "import",
 "extras",
 "KHR_materials_unlit",
 "names",
] }
image = { version = "0.25", default-features = false, features = [
 "png",
 "jpeg",
 "webp",
 "exr",
] }
exr = "1.74"
serde = { workspace = true }
serde_json = { workspace = true }
un-avatar-core = { path = "../un-avatar-core" }
un-avatar-io = { path = "../un-avatar-io" }
un-avatar-types = { path = "../un-avatar-types" }

[lints]
workspace = true
