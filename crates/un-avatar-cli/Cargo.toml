[package]
name = "un-avatar-cli"
description = "UN Avatar — コマンドライン（bootstrap）"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[[bin]]
name = "un-avatar"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck"] }
serde = { workspace = true }
serde_json = { workspace = true }
un-avatar-core = { path = "../un-avatar-core" }
un-avatar-io = { path = "../un-avatar-io" }
un-avatar-io-gltf = { path = "../un-avatar-io-gltf" }
un-avatar-io-vrm = { path = "../un-avatar-io-vrm" }
un-avatar-plugin-host = { path = "../un-avatar-plugin-host" }
un-avatar-skeleton = { path = "../un-avatar-skeleton" }
un-avatar-vmc = { path = "../un-avatar-vmc" }
un-motion-frame = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
