[package]
name = "un-avatar-render-wgpu"
description = "UN Avatar — winit + wgpu window and render loop (Phase 1.1–1.2 bootstrap)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
autobins = false

[features]
default = []
# Spout2 SDK（Windows）。ビルド前に SPOUT2_SDK_DIR（SpoutSender.h）と SPOUT2_LIB_DIR（Spout.lib）、プロセス起動前に Spout.dll への PATH が必要。
spout-sdk = ["dep:spout-rs"]
bcn-gpu-bench = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "un-avatar-renderer"
path = "src/main.rs"

[[bin]]
name = "bcn-bench"
path = "src/bin/bcn_bench.rs"

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.6", features = ["derive"] }
glam = { version = "0.32", features = ["bytemuck"] }
half = "2"
image = { version = "0.25", default-features = false, features = [
 "png",
 "jpeg",
 "webp",
] }
pic-scale = "0.7.6"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zenoh = { workspace = true }
pollster = "0.4"
un-avatar-core = { path = "../un-avatar-core" }
un-avatar-io = { path = "../un-avatar-io" }
un-avatar-skeleton = { path = "../un-avatar-skeleton" }
un-avatar-vmc = { path = "../un-avatar-vmc" }
un-avatar-zenoh = { path = "../un-avatar-zenoh" }
un-avatar-io-gltf = { path = "../un-avatar-io-gltf" }
un-avatar-io-vrm = { path = "../un-avatar-io-vrm" }
un-motion-frame = { workspace = true }
un-motion-frame-zenoh = { workspace = true }
crossbeam-channel = { workspace = true }
crossbeam-queue = "0.3"
cpal = "0.15"
rustfft = "6"
wgpu = { version = "29", default-features = false, features = [
 "std",
 "parking_lot",
 "dx12",
 "vulkan",
 "gles",
 "wgsl",
] }
block_compression = { version = "0.9", default-features = false, features = [
 "bc15",
 "bc7",
 "wgpu",
] }
winit = "0.30"
memory-stats = "1.2"

[target.'cfg(windows)'.dependencies]
spout-rs = { version = "0.1.3", optional = true }
tray-icon = "0.21.3"
windows = { version = "0.61.3", features = [
 "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
naga = { version = "29.0.3", features = ["wgsl-in"] }

[lints]
workspace = true
